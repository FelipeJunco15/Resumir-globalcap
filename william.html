<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>William</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      margin-top: 60px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 40px;
    }

    form {
      background: white;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    input[type="file"] {
      margin: 20px;
      padding: 10px;
    }

    button {
      padding: 15px;
      width: 200px;
      border: none;
      border-radius: 8px;
      background: #2d6cdf;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #1b4fb3;
    }

    /* Estilos para que las tablas de Python se vean ordenadas y estéticas */
    #resultado {
      margin: 40px auto;
      max-width: 90%;
      text-align: left;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #2d6cdf;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    h2 {
      color: #2d6cdf;
      border-bottom: 2px solid #2d6cdf;
      padding-bottom: 5px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>SUBIR ARCHIVO - - William Mauricio(Colombia y Canada)</h1>

  <form enctype="multipart/form-data">
    <input type="file" name="file" required>
    <br><br>
    <button type="button" id="btnSubir">Subir archivo</button>
  </form>

  <div id="resultado" style="display: none;"></div>

  <br><br>
  <a href="index.html">← Volver</a>

  <script src="index.js"></script>

</body>
</html>
